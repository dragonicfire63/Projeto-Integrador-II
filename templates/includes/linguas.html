    const ignored='script,style,noscript,[contenteditable="true"],.folder-name,.folder-tag,.note-entry-title,.linked-postit-title,.linked-postit-body,.tag-result-title,.tag-result-tag,.nb-name,.nb-tag,.cat-pick,.legend-chip,.upcoming-card .title,.ev-title,.ev-chip,.postit-title,.postit-body,.postit-chip,.popover-title span,#d-title,#d-cat-name,#d-note-title,#d-note-preview,#nb-selected-name,#ev-title,#category-name,#pt-title,#pt-body';
    const pref=JSON.parse(document.getElementById('language-preference-data').textContent);
    let language=pref.authenticated?pref.lang:'pt';
    if(!pref.authenticated){try{language=localStorage.getItem('conexo-language')||language}catch(error){}}
    // Mantem o original e o último texto aplicado para retransladar elementos sem acumular traduções.
    const originalText=new WeakMap();
    const lastText=new WeakMap();
    const originalAttributes=new WeakMap();
    const lastAttributes=new WeakMap();
    const attributes=['aria-label','aria-description','title','placeholder'];
    function translateValue(value){
      if(language!=='en')return value;
      const trimmed=value.trim();
      if(translations[trimmed]!==undefined)return value.replace(trimmed,translations[trimmed]);
      let match=trimmed.match(/^(\d+) (pasta|pastas) · (\d+) (nota|notas) no total$/);
      if(match)return `${match[1]} ${match[1]==='1'?'folder':'folders'} · ${match[3]} ${match[3]==='1'?'note':'notes'} total`;
      match=trimmed.match(/^(\d+) (pasta|pastas) · (\d+) (nota|notas)$/);
      if(match)return `${match[1]} ${match[1]==='1'?'folder':'folders'} · ${match[3]} ${match[3]==='1'?'note':'notes'}`;
      match=trimmed.match(/^(\d+) (nota|notas) com esta tag$/);
      if(match)return `${match[1]} ${match[1]==='1'?'note':'notes'} with this tag`;
      match=trimmed.match(/^(\d+) (resultado|resultados)$/);
      if(match)return `${match[1]} ${match[1]==='1'?'result':'results'}`;
      match=trimmed.match(/^(\d+) (nota|notas)$/);
      if(match)return `${match[1]} ${match[1]==='1'?'note':'notes'}`;
      match=trimmed.match(/^(\d+) (evento|eventos) a seguir$/);
      if(match)return `${match[1]} upcoming ${match[1]==='1'?'event':'events'}`;
      match=trimmed.match(/^Hoje · (.+)$/);
      if(match)return `Today · ${match[1]}`;
      match=trimmed.match(/^(Janeiro|Fevereiro|Março|Abril|Maio|Junho|Julho|Agosto|Setembro|Outubro|Novembro|Dezembro) (\d{4})$/);
      if(match){
        const monthNames={Janeiro:'January',Fevereiro:'February','Março':'March',Abril:'April',Maio:'May',Junho:'June',Julho:'July',Agosto:'August',Setembro:'September',Outubro:'October',Novembro:'November',Dezembro:'December'};
        return `${monthNames[match[1]]} ${match[2]}`;
      }
      const weekdays={Dom:'Sun',Seg:'Mon',Ter:'Tue',Qua:'Wed',Qui:'Thu',Sex:'Fri','Sáb':'Sat'};
      if(weekdays[trimmed])return weekdays[trimmed];
      match=trimmed.match(/^Nenhum post-it encontrado para "(.+)"\.$/);
      if(match)return `No sticky notes found for "${match[1]}".`;
      match=trimmed.match(/^Localização: (.+)$/);
      if(match)return `Location: ${match[1]}`;
      match=trimmed.match(/^Excluir a categoria "(.+)"\?(.+)$/);
      if(match)return `Delete category "${match[1]}"?${match[2]}`;
      match=trimmed.match(/^Excluir o post-it "(.+)"\? (.+)$/);
      if(match)return `Delete sticky note "${match[1]}"? ${translations[match[2]]||match[2]}`;
      match=trimmed.match(/^Excluir o evento "(.+)"\? (.+)$/);
      if(match)return `Delete event "${match[1]}"? ${translations[match[2]]||match[2]}`;
      return value;
    }
    function translateNode(node){
      if(node.nodeType===Node.TEXT_NODE){
        if(node.parentElement?.closest(ignored))return;
        if(!originalText.has(node)||node.data!==lastText.get(node))originalText.set(node,node.data);
        const translated=translateValue(originalText.get(node));
        if(node.data!==translated){node.data=translated;lastText.set(node,translated)}
        else lastText.set(node,node.data);
      }else if(node.nodeType===Node.ELEMENT_NODE){
        if(node.matches(ignored))return;
        attributes.forEach(attribute=>{
          if(!node.hasAttribute(attribute))return;
          let values=originalAttributes.get(node);
          if(!values){values={};originalAttributes.set(node,values)}
          let applied=lastAttributes.get(node);
          if(!applied){applied={};lastAttributes.set(node,applied)}
          if(values[attribute]===undefined||node.getAttribute(attribute)!==applied[attribute])values[attribute]=node.getAttribute(attribute);
          const translated=translateValue(values[attribute]);
          if(node.getAttribute(attribute)!==translated)node.setAttribute(attribute,translated);
          applied[attribute]=translated;
        });
        node.childNodes.forEach(translateNode);
      }
    }
    function setLanguage(next){
      language=next==='en'?'en':'pt';
      document.documentElement.lang=language==='en'?'en':'pt-BR';
      try{localStorage.setItem('conexo-language',language)}catch(error){}
      translateNode(document.documentElement);
      const selector=document.getElementById('s-lang');
      if(selector)selector.value=language;
    }
    window.setAppLanguage=setLanguage;
    const localeMethods=['toLocaleString','toLocaleDateString','toLocaleTimeString'];
    localeMethods.forEach(method=>{
      const original=Date.prototype[method];
      Date.prototype[method]=function(locales,...args){
        const target=language==='en'&&(!locales||locales==='pt-BR'||locales==='pt-br')?'en-US':locales;
        return original.call(this,target,...args);
      };
    });
    document.addEventListener('DOMContentLoaded',()=>{
      setLanguage(language);
      const selector=document.getElementById('s-lang');
      selector?.addEventListener('change',()=>setLanguage(selector.value));
      new MutationObserver(records=>records.forEach(record=>{
        record.addedNodes.forEach(translateNode);
        if(record.type==='characterData')translateNode(record.target);
        if(record.type==='attributes')translateNode(record.target);
      })).observe(document.documentElement,{subtree:true,childList:true,characterData:true,attributes:true,attributeFilter:attributes});
    },{once:true});
  })();
